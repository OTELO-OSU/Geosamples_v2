# Intégration continue : tests backend (PHPUnit + PostgreSQL) et compilation du front.
stages: [test, build]

backend:
  stage: test
  image: php:8.3-cli-alpine
  services:
    - name: postgres:18-alpine
      alias: database
  variables:
    POSTGRES_DB: geosamples_test
    POSTGRES_USER: tester
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: "postgresql://tester:test_password@database:5432/geosamples?serverVersion=18&charset=utf8"
  before_script:
    - apk add --no-cache postgresql-dev icu-dev libzip-dev openssl git unzip $PHPIZE_DEPS
    - docker-php-ext-install pdo_pgsql intl zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - cd backend && composer install --no-interaction --no-progress
    - mkdir -p config/jwt
    - openssl genpkey -algorithm RSA -out config/jwt/private.pem -aes256 -pass pass:change-me-jwt-passphrase -pkeyopt rsa_keygen_bits:2048
    - openssl pkey -in config/jwt/private.pem -passin pass:change-me-jwt-passphrase -pubout -out config/jwt/public.pem
    - printf 'DATABASE_URL="%s"\n' "$DATABASE_URL" >> .env.test
  script:
    - vendor/bin/phpunit
  cache:
    key: composer
    paths: [backend/vendor/]

front:
  stage: build
  image: node:24-alpine
  script:
    - cd front && npm ci --no-audit --no-fund && npm run build
  artifacts:
    paths: [front/dist/]
    expire_in: 1 week
