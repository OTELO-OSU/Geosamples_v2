lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # Short-lived access token, held in frontend memory (as in ORDaR v2);
    # session continuity relies on the refresh token in an HttpOnly cookie.
    token_ttl: 900
    user_id_claim: email
