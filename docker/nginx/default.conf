# A single server{} for ALL sites: the backend chooses the site from the hostname
# (Host) or /s/<slug>/ prefix. Adding a site requires no changes here.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/frontend/dist;
    index index.html;
    client_max_body_size 512M;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.opentopomap.org https://data.geopf.fr https://server.arcgisonline.com https://geoservices.brgm.fr; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # Shibboleth sign-in: attribute headers must ONLY come from the reverse proxy
    # (Apache mod_shib). Voir docs/federation.md et SHIB_SHARED_SECRET.
    location = /api/auth/shibboleth {
        limit_req zone=auth burst=10;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location ~ ^/api/auth/ {
        limit_req zone=auth burst=20;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 180s;
        fastcgi_buffers 16 32k;
        fastcgi_buffer_size 64k;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage (y compris /s/<slug>/…)
    location / {
        try_files $uri /index.html;
    }
}
